<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:transparent; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  #status { position:fixed; bottom:4px; left:4px; font-family:monospace;
            font-size:9px; color:#00ffe740; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">initializing...</div>

<script type="module">
// ── Imports via esm.sh (rewrites bare specifiers — works in Android WebView) ──
import * as THREE from 'https://esm.sh/three@0.163.0';
import { GLTFLoader } from 'https://esm.sh/three@0.163.0/examples/jsm/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from 'https://esm.sh/@pixiv/three-vrm@2.1.0';

const status = document.getElementById('status');
const log = (s) => { status.textContent = s; };

// ── Scene ─────────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, premultipliedAlpha: false });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
camera.position.set(0, 1.3, 3.5);
camera.lookAt(0, 1.1, 0);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(1, 2, 3); scene.add(dir);
const fill = new THREE.DirectionalLight(0x8888ff, 0.3);
fill.position.set(-1, 0, -1); scene.add(fill);

// ── Placeholder (shown until VRM loads) ───────────────────────────────────────
const placeholder = new THREE.Group();
const sphereGeo   = new THREE.SphereGeometry(0.3, 32, 32);
const sphereMat   = new THREE.MeshStandardMaterial({
  color: 0x00ffe7, emissive: 0x003322, roughness: 0.4, metalness: 0.6 });
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.set(0, 1.2, 0);
placeholder.add(sphere);
scene.add(placeholder);

// ── State machine ─────────────────────────────────────────────────────────────
let state     = 'IDLE';
let vrm       = null;
let blinkT    = 0;
let mouthVal  = 0;
let headDrift = { x: 0, y: 0, tx: 0, ty: 0 };
const clock   = new THREE.Clock();

// ── Resize ────────────────────────────────────────────────────────────────────
function resize() {
  const w = canvas.clientWidth  || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// ── Animation loop ────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t  = clock.getElapsedTime();

  // Placeholder spin
  if (!vrm) {
    sphere.rotation.y += dt * 0.8;
    sphere.position.y  = 1.2 + Math.sin(t * 1.2) * 0.04;
  }

  if (vrm) {
    // Head drift (organic idle movement)
    headDrift.tx = Math.sin(t * 0.4) * 0.06 + Math.sin(t * 1.1) * 0.02;
    headDrift.ty = Math.sin(t * 0.3) * 0.04 + Math.cos(t * 0.7) * 0.02;
    headDrift.x += (headDrift.tx - headDrift.x) * 0.05;
    headDrift.y += (headDrift.ty - headDrift.y) * 0.05;

    const head = vrm.humanoid.getNormalizedBoneNode('head');
    if (head) {
      head.rotation.x = headDrift.y;
      head.rotation.y = headDrift.x;
    }

    // Neck subtle motion
    const neck = vrm.humanoid.getNormalizedBoneNode('neck');
    if (neck) {
      neck.rotation.x = headDrift.y * 0.3;
      neck.rotation.y = headDrift.x * 0.4;
    }

    // Blink cycle
    blinkT += dt;
    const blinkInterval = 2.5 + Math.sin(t * 0.1) * 1.5;
    if (blinkT > blinkInterval) {
      blinkT = 0;
      doBlink();
    }

    // State-based expressions
    const em = vrm.expressionManager;
    if (em) {
      switch (state) {
        case 'THINKING':
          em.setValue('thinking', Math.min(1, em.getValue('thinking') + dt * 2));
          break;
        case 'SPEAKING':
          mouthVal = 0.3 + Math.sin(t * 12) * 0.25;
          em.setValue('aa', Math.max(0, mouthVal));
          break;
        case 'IDLE':
        default:
          em.setValue('thinking', Math.max(0, em.getValue('thinking') - dt * 2));
          em.setValue('aa', Math.max(0, em.getValue('aa') - dt * 4));
          break;
      }
    }

    vrm.update(dt);
  }

  renderer.render(scene, camera);
}
animate();
log('ready — no VRM loaded');

// ── Blink ─────────────────────────────────────────────────────────────────────
function doBlink() {
  if (!vrm?.expressionManager) return;
  const em = vrm.expressionManager;
  em.setValue('blinkLeft', 1); em.setValue('blinkRight', 1);
  setTimeout(() => {
    if (!vrm?.expressionManager) return;
    vrm.expressionManager.setValue('blinkLeft', 0);
    vrm.expressionManager.setValue('blinkRight', 0);
  }, 120 + Math.random() * 80);
}

// ── VRM loader ────────────────────────────────────────────────────────────────
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));

window.loadVRM = function(url) {
  log('loading VRM...');
  loader.load(url,
    (gltf) => {
      if (vrm) { scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
      vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      scene.remove(placeholder);
      scene.add(vrm.scene);
      log('VRM loaded');
      if (window.Android) window.Android.onEvent('loaded');
    },
    (prog) => { log('loading... ' + Math.round(prog.loaded / prog.total * 100) + '%'); },
    (err)  => { log('VRM error: ' + err.message);
                if (window.Android) window.Android.onEvent('error:' + err.message); }
  );
};

// ── Public API (called by Android via evaluateJavascript) ─────────────────────
window.setState = (s)    => { state = s; };
window.setMouth = (v)    => { mouthVal = v; };
window.setExpression = (name, value) => {
  vrm?.expressionManager?.setValue(name, parseFloat(value));
};

log('avatar renderer ready');
</script>
</body>
</html>
